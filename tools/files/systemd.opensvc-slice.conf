# Installed as opensvc.slice.d/10-opensvc-server.conf and
# opensvc-.slice.d/10-opensvc-server.conf, so it applies to opensvc.slice
# and to every opensvc-*.slice below it.
#
# The container engines place the containers in docker-<id>.scope or
# libpod-<id>.scope units inside these slices, out of the cgroup delegated
# to opensvc-server.service. With the default dependencies, the slices
# conflict with shutdown.target: at system shutdown, systemd stops the
# slices, the stop propagates to the scopes, and the containers are sent
# SIGTERM before the daemon has stopped the services in their order.
#
# Without the default dependencies, the containers are stopped by the
# opensvc-server.service shutdown only.
[Unit]
DefaultDependencies=no
